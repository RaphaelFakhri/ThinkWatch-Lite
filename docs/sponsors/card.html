<!doctype html>
<!--
  The sponsor cards in the README, rendered to PNG by render.sh: one card per
  sponsor, language and GitHub theme, 900×220 at twice the pixel density.
  A sponsor's tagline and description are its own copy, used as supplied (the
  Chinese is a translation of it); thinkwat.ch/sponsors carries the same text.
  Opened with ?sponsor=<id>&lang=<en|zh>&theme=<light|dark>.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; src: url(../../node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: url(../../node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist"; src: url(../../node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2) format("woff2"); font-weight: 600; }

  html, body { margin: 0; background: transparent; }
  body {
    font-family: "Geist", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Dark follows thinkwat.ch, light follows GitHub's light theme */
  .dark {
    --surface-a: #111215; --surface-b: #0c0d0f; --border: rgba(255, 255, 255, 0.10);
    --text: #f7f8f8; --muted: #9ca1a9; --dim: #7a808a;
  }
  .light {
    --surface-a: #ffffff; --surface-b: #f8f9fb; --border: #d1d9e0;
    --text: #1f2328; --muted: #59636e; --dim: #6e7781;
  }

  .card {
    box-sizing: border-box;
    width: 900px;
    height: 220px;
    display: grid;
    grid-template-columns: 300px 1fr;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(180deg, var(--surface-a), var(--surface-b));
    color: var(--text);
  }

  /* The sponsor's own plate: its logo on black, the same in both themes */
  .plate {
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, 0.07), transparent 60%), #050505;
    border-right: 1px solid var(--border);
  }
  .plate img { display: block; width: 220px; height: auto; }

  .body { display: grid; align-content: center; min-width: 0; padding: 0 36px; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim);
  }
  .zh .eyebrow { letter-spacing: 0.08em; }
  .eyebrow i { width: 6px; height: 6px; border-radius: 99px; background: linear-gradient(135deg, #22e5f2, #f05cd8); }
  .eyebrow span { margin-left: auto; letter-spacing: 0.02em; text-transform: none; }
  .tagline { margin: 16px 0 0; font-size: 22px; font-weight: 600; line-height: 28px; letter-spacing: -0.015em; }
  .zh .tagline { letter-spacing: 0; }
  .desc { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: var(--muted); text-wrap: pretty; }
  .zh .desc { line-height: 23px; word-break: keep-all; line-break: strict; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const sponsors = {
    voyageage: {
      name: "VoyageAge",
      logo: "logos/voyageage.png",
      site: "voyageage.com",
      en: {
        tagline: "One API. More models. Lower costs.",
        description: "VoyageAge brings leading AI models together through one OpenAI-compatible API. Built for developers, teams, and AI startups, it offers competitive pricing and pay-as-you-go billing, making it easier to integrate AI into your projects. Sign up for free trial credits and start building.",
      },
      zh: {
        tagline: "一个 API，更多模型，更低成本。",
        description: "VoyageAge 通过一个兼容 OpenAI 的 API 汇集领先的 AI 模型。它面向开发者、团队和 AI 初创公司，价格具有竞争力，按量计费，让你更轻松地把 AI 集成到项目中。注册即可获得免费试用额度，立即开始构建。",
      },
    },
  };
  const label = { en: "Sponsor", zh: "赞助商" };

  const q = new URLSearchParams(location.search);
  const lang = q.get("lang");
  const s = sponsors[q.get("sponsor")];
  const copy = s[lang];
  const card = document.getElementById("card");
  card.className = `card ${q.get("theme")} ${lang}`;
  card.innerHTML = `
    <div class="plate"><img src="${s.logo}" alt=""></div>
    <div class="body">
      <div class="eyebrow"><i></i>${label[lang]}<span>${s.site} ↗</span></div>
      <p class="tagline"></p>
      <p class="desc"></p>
    </div>`;
  card.querySelector(".tagline").textContent = copy.tagline;
  card.querySelector(".desc").textContent = copy.description;
</script>
</body>
</html>
