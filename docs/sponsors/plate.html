<!doctype html>
<!--
  A sponsor's plate in the README: its logo on black, the same in GitHub's light
  and dark themes. Rendered to <sponsor>-plate.png by render.sh, 600×200 at
  twice the pixel density. Opened with ?logo=logos/<sponsor>.png, a white logo
  on a transparent background.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .plate {
    width: 600px;
    height: 200px;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, 0.07), transparent 60%), #050505;
  }
  .plate img { display: block; width: 400px; height: auto; }
</style>
</head>
<body>
<div class="plate"><img id="logo" alt=""></div>
<script>
  document.getElementById("logo").src = new URLSearchParams(location.search).get("logo");
</script>
</body>
</html>
